<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queen Cassy Food Cart</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="/css/login.css" />

    <!-- Materialize -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link type="text/css" href="/css/materialize.min.css" rel="stylesheet" />
    <script type="text/javascript" src="/js/materialize.min.js"></script>

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <main>
      <div class="login-wrapper">
        <div class="card login-card z-depth-3">
          <!--LOGO-->
          <img src="/assets/queencassy.jpg" alt="Logo" class="logo" />

          <div class="title">Welcome</div>
          <div class="subtitle">Please Log in To Continue</div>

          <!-- FORM -->
          <form id="login-form">
          <div class="input-field">
            <i class="material-icons prefix">person</i>
            <input
              id="username"
              type="text"
              placeholder="Username or Email"
              autocomplete="username"
              required
            />
          </div>

          <div class="input-field">
            <i class="material-icons prefix">lock</i>
            <input
              id="password"
              type="password"
              placeholder="Password"
              autocomplete="current-password"
              required
            />
            <label for="password">Password</label>
            <span
              class="material-icons toggle-password"
              onclick="togglePassword()"
              >visibility</span
            >
          </div>

          <p class="remember-me">
            <label>
              <input type="checkbox" />
              <span>Remember Me</span>
            </label>
          </p>

          <button
            id="login-button"
            type="submit"
            class="btn btn-login waves-effect waves-light"
          >
            <span class="login-button-label">Log In</span>
            <span class="login-button-loading" aria-hidden="true">
              <span class="login-spinner"></span>
              Logging in...
            </span>
          </button>
          </form>

          <button
            id="installBtn"
            class="btn btn-install waves-effect waves-light"
          >
            Install App
          </button>
        </div>
      </div>
    </main>
  </body>

  <!-- JS Files -->
  <script src="/js/login.js"></script>
  <script type="module" src="/js/app.js"></script>
  <script src="/js/install.js"></script>
  <script src="/js/refresh.js"></script>
  <script type="module" src="/js/IndexDB.js"></script>
  <!-- FIREBASE -->
  <script type="module">
    import { auth, db } from "/js/firebase.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      collection,
      query,
      where,
      getDocs,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import {
      syncUsersFromFirebase,
      offlineLogin,
      SyncProductFromFirebase,
    } from "/js/IndexDB.js";
    import { requestDeviceNotificationPermission } from "/js/deviceNotifications.js";

    // auto-sync users and products once online

    window.addEventListener("load", async () => {
      if (navigator.onLine) {
        await syncUsersFromFirebase();
        await SyncProductFromFirebase();
      }
    });

    document
      .getElementById("login-form")
      .addEventListener("submit", async (e) => {
        e.preventDefault();
        const loginButton = document.getElementById("login-button");
        if (loginButton?.disabled) return;

        const setLoginLoading = (isLoading) => {
          if (!loginButton) return;
          loginButton.disabled = isLoading;
          loginButton.classList.toggle("is-loading", isLoading);
          loginButton.setAttribute("aria-busy", String(isLoading));
        };

        const username = document
          .getElementById("username")
          .value.toLowerCase()
          .trim();
        const password = document.getElementById("password").value;
        let isRedirecting = false;
        setLoginLoading(true);

        try {
          //offline fallback
          if (!navigator.onLine) {
            console.log("Offline mode detected");
            await offlineLogin(username, password);
            return;
          }

          //online login(firebase)
          const q = query(
            collection(db, "users"),
            where("username", "==", username),
          );
          const snapshot = await getDocs(q);

          if (!snapshot.empty) {
            const userDocSnap = snapshot.docs[0];
            const userDoc = userDocSnap.data();
            const email = userDoc.email;

            const userCredential = await signInWithEmailAndPassword(
              auth,
              email,
              password,
            );
            console.log("Login Success:", userCredential);

                        const role = userDoc.role.toLowerCase();
            isRedirecting = true;

            // Request notification permission and save token
            await requestDeviceNotificationPermission(userDocSnap.id);

            if (role === "admin") {
              sessionStorage.setItem("adminUserDocId", userDocSnap.id);
              window.location.href = "/admin/adminpanel.html";
            } else {

              // Bawat non-admin role (siomai, pares, at anumang bagong cart sa
              // hinaharap) ay dumadaan na lang sa IISANG POS page. Ang role
              // mismo ang nagpapaiba sa nakikita, hindi ang URL/folder.
              sessionStorage.setItem("employeeRole", role);
              sessionStorage.setItem("employeeUid", userCredential.user.uid);
              sessionStorage.setItem("employeeUsername", username);
              sessionStorage.setItem("employeeUserDocId", userDocSnap.id);

              window.location.href = "/employee/siomai/userpanel.html";
            }
          } else {
            M.toast({
              html: "Username not found",
              classes: "red-toast",
              displayLength: 4000,
            });
            console.log("No match for:", username);
          }
        } catch (error) {
          M.toast({
            html: "Invalid username or password",
            classes: "red-toast",
            displayLength: 4000,
          });
          console.error(error);
        } finally {
          if (!isRedirecting) setLoginLoading(false);
        }
      });
  </script>
</html>
