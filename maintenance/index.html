<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance | Queen Cassy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .maintenance {
            width: 100%;
            max-width: 500px;
            padding: 40px 25px;
            background: #fff;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 28px;
        }

        p {
            margin: 0;
            line-height: 1.6;
            color: #666;
        }

        .small {
            margin-top: 20px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="maintenance">

        <div class="icon">🔧</div>

        <h1>Under Maintenance</h1>

        <p>
            Queen Cassy is currently undergoing system maintenance.
            Please check back again later.
        </p>

        <p class="small">
            We apologize for the inconvenience.
        </p>

    </div>

</body>
</html>
