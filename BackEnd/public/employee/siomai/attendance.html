<div id="content">
  <section class="page-header attendance-page-heading">
    <div>
      <p id="attendance-current-date">
        Track your shift and recent attendance activity.
      </p>
    </div>
    <button type="button" class="time-in-button" id="time-in-button">
      <span class="material-icons">login</span>
      Time In
    </button>
  </section>

  <div class="container attendance-dashboard">
    <section class="attendance-status-banner" aria-live="polite">
      <div class="attendance-status-icon">
        <span class="material-icons">schedule</span>
      </div>
      <div>
        <span>Today&apos;s shift</span>
        <strong id="today-status-value">Ready to time in</strong>
        <small id="today-status-note"
          >Submit your request when you are ready to start.</small
        >
      </div>
    </section>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Hours</div>
        <div class="stat-value">
          <span id="total-hours-value">0.0</span> <span>hrs</span>
        </div>
        <div class="stat-sub positive" id="total-hours-note">
          <span class="material-icons">trending_up</span>
          This week
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Shift Streak</div>
        <div class="stat-value">
          <span id="shift-streak-value">0</span> <span>days</span>
        </div>
        <div class="stat-sub badge" id="shift-streak-note">
          <span class="material-icons">emoji_events</span>
          Current streak
        </div>
      </div>

      <div class="stat-card status-stat-card">
        <div class="stat-label">Shift Status</div>
        <div class="stat-value status-stat-value" id="today-status-stat">
          Ready
        </div>
        <div class="stat-sub badge" id="today-status-stat-note">
          <span class="material-icons">schedule</span>
          Today
        </div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-range="today" aria-pressed="true">
        Today
      </button>

      <button class="tab" data-range="week" aria-pressed="false">
        This Week
      </button>
    </div>
    <div class="section-title">Recent Activity</div>

    <div class="activity-list"></div>

    <i class="material-icons more">more_vert</i>
  </div>
</div>
