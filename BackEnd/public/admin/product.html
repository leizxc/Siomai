      <!-- Add Product Form -->
      <section class="card add-product-card">
        <h4>Add Product Sales</h4>
        <form id="addProductForm">
          <!-- Role Selection -->
          <div class="input-field">
            <select id="productRole" required>
              <option value="" disabled selected>Choose Role</option>
              <option value="siomai">Siomai</option>
              <option value="pares">Pares</option>
            </select>
            <label for="productRole">Employee Role</label>
          </div>

          <!-- Employee Selection -->
          <div class="input-field">
            <select id="productEmployee">
              <option value="" selected>All Employees (Shared)</option>
              <!-- Dito papasok yung mga nasa Firestore -->
            </select>
            <label for="productEmployee">Assign to Specific Employee</label>
          </div>

          <!-- Product Inputs -->
          <div class="input-field">
            <input type="text" id="productName" required>
            <label for="productName">Product Name</label>
          </div>

          <div class="input-field">
            <input type="number" id="productPrice" step="0.01" required>
            <label for="productPrice">Product Price</label>
          </div>

          <div class="input-field">
            <input type="number" id="productStock" required>
            <label for="productStock">Product Stock</label>
          </div>

          <button type="submit" class="btn green" disabled id="addProductBtn">Add Product</button>
        </form>
      </section>

      <!-- Product List Table -->
      <section class="card product-list-card">
        <h4>Product List</h4>

        <!-- Filter by Role -->
        <div class="input-field">
          <select id="filterRole">
            <option value="" selected>All Roles</option>
            <option value="siomai">Siomai</option>
            <option value="pares">Pares</option>
          </select>
          <label for="filterRole">Filter by Role</label>
        </div>

        <table id="productTable">
          <thead>
            <tr>
              <th>Product Name</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Role</th>
              <th>Employee</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- Update Product Modal -->
      <div id="modal-edit-product" class="modal">
        <div class="modal-content">
          <h4>Update Product</h4>
          <form id="updateProductForm">
            <input type="hidden" id="updateProductId">

            <div class="input-field">
              <input type="text" id="edit-name" required>
              <label for="edit-name">Product Name</label>
            </div>

            <div class="input-field">
              <input type="number" id="edit-price" step="0.01" required>
              <label for="edit-price">Product Price</label>
            </div>

            <div class="input-field">
              <input type="number" id="edit-stock" required>
              <label for="edit-stock">Product Stock</label>
            </div>

            <div class="modal-footer">
              <button type="button" id="edit-save" class="btn blue">Save Changes</button>
            </div>
          </form>
        </div>
  <!-- JS modules -->
  <script src="/js/refresh.js"></script>
  <script src="/js/functionalnav.js"></script>
  <script type="module" src="/js/firebase.js"></script>
  <script type="module" src="/js/addproductbtn.js"></script>
  <script type="module" src="/js/adminaddProduct.js"></script>
</body>
</html>
