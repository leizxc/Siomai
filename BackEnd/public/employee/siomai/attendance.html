<div id="content">
  <section class="page-header">
    <div>
      <h2>Attendance</h2>
    </div>
    <button type="button" class="time-in-button" id="time-in-button">
      <span class="material-icons">login</span>
      Time In
    </button>
  </section>

  <div class="container">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Hours</div>
        <div class="stat-value"><span id="total-hours-value">0.0</span> <span>hrs</span></div>
        <div class="stat-sub positive" id="total-hours-note">
          <span class="material-icons">trending_up</span>
          This week
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Shift Streak</div>
        <div class="stat-value"><span id="shift-streak-value">0</span> <span>days</span></div>
        <div class="stat-sub badge" id="shift-streak-note">
          <span class="material-icons">emoji_events</span>
          Current streak
        </div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab">Today</button>
      <button class="tab active">This Week</button>
      <button class="tab-calendar">
        <span class="material-icons">calendar_today</span>
      </button>
    </div>

    <div class="section-title">Recent Activity</div>

    <div class="activity-list">
    </div>

    <i class="material-icons more">more_vert</i>
  </div>
</div>
