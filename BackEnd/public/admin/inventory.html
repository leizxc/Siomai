<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel Queen Cassy Food Cart</title>

  <!-- Custom CSS -->
  <link rel="stylesheet" type="text/css" href="/css/admin.css">

  <!-- Materialize -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
  <script type="text/javascript" src="/js/materialize.min.js"></script>

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json">
</head>

<body>
  <div class="container">
    <main class="main">
      <header class="header">
        <h1>Inventory (Products)</h1>
        <p>Product List and Stocks</p>
      </header>

      <!-- FILTERS -->
      <div class="filters">
        <input type="date" id="filter-date">
      <div class="category-filter">
        <select id="filter-category">
          <option value="all">All Categories</option>
        </select>
        <button id="btn-add" class="waves-effect waves-light btn">Add Product</button>
        <button id="btn-add-categories" class="waves-effect waves-light btn">Add Categories</button>
      </div>
      </div>

      <!--ADD categories-->
      <div id="modal-add-category" class="modal">
        <div class="modal-content">
          <h4>Add Categories</h4>

          <div class="input-field">
            <input type="text" placeholder="Add new Categories" id="new-category-name">
          </div>

          <div class="input-field">
            <select id="new-category-unit">
              <option value="" disabled selected>Choose unit</option>\
              <option value="pack">pack</option>
              <option value="kg">Kilogram</option>
            </select>
            <label for="new-category-unit">Unit Type</label>
          </div>

          <div class="input-field" id="pieces-per-pack-field" style="display: none;">
            <input type="number" id="pieces-per-pack" placeholder="Pieces per Pack">
          </div>

          <div class="modal-footer">
            <button id="save-category" class="waves-effect waves-green btn">Save new Categories</button>
          </div>

        </div>
      </div>


      <!-- ADD PRODUCT MODAL -->
      <div id="modal-add" class="modal">
        <div class="modal-content">
          <h4>Add Product</h4>
          <div class="input-field">
            <input id="product-name" type="text" placeholder="Product Name">
          </div>
          <div class="input-field">
            <select id="product-category">
              <option value="" disabled selected>Choose Category</option>
            </select>
            <label>Category</label>
          </div>
          <div class="input-field">
            <input id="product-packs" type="number" placeholder="Number of Packs">
            <label for="product-packs"> </label>
          </div>
          <div class="input-field">
            <input id="product-price" type="number" placeholder="Unit Price">
          </div>
          
        </div>
        <div class="modal-footer">
          <button id="save-product" class="waves-effect waves-green btn">Save Product</button>
        </div>
      </div>

      <!-- EDIT PRODUCT MODAL -->
      <div id="modal-edit" class="modal">
        <div class="modal-content">
          <h4>Edit Product</h4>
          <div class="input-field">
            <input id="edit-name" type="text">
          </div>
          <div class="input-field">
            <select id="edit-category">
              <option value="" disabled selected>Choose Category</option>
              <option value="Siomai">Siomai</option>
            </select>
            <label>Category</label>
          </div>
          <div class="input-field">
            <input id="edit-packs" type="number">
          </div>
          <div class="input-field">
            <input id="edit-price" type="number">
          </div>
        </div>
        <div class="modal-footer">
          <button id="edit-save" class="waves-effect waves-light btn blue">Update Product</button>
        </div>
      </div>

      <!-- SUMMARY -->
      <section class="summary">
        <div class="card">
          <h3 id="total-products">0</h3>
          <p>Total Products</p>
        </div>
        <div class="card">
          <h3 id="total-stocks">0</h3>
          <p id="stocks-label">Total Pieces</p>
        </div>
        <div class="card">
          <h3 id="total-value">₱0.00</h3>
          <p>Total Inventory Value</p>
        </div>
        <div class="card">
          <h3 id="total-categories">0</h3>
          <p>Categories</p>
        </div>
      </section>

      <!-- TABLE -->
      <section class="inventory-card">
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Total Packs</th>
              <th>Total Pieces</th>
              <th>Unit Price</th>
              <th>Total Value</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="inventory-table-body">
            <!-- Firestore data will be injected here -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="/js/refresh.js"></script>
  <script src="/js/functionalnav.js"></script>
  <script type="module" src="/js/firebase.js"></script>
  <script type="module">
    import { loadInventory, loadCategories } from "/js/adminBE.js";
    loadInventory();
    loadCategories();
  </script>

</html>
