<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel Queen Cassy Food Cart</title>
    <link rel="stylesheet" type="text/css" href="../css/admin.css">

    <!-- Materialize -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link type="text/css" href="../css/materialize.min.css" rel="stylesheet">
    <script type="text/javascript" src="../js/materialize.min.js"></script>
    <!-- Manifest -->
    <link rel="manifest" href="../manifest.json">
</head>

<body>
    <main class="main">
        <header class="header">
            <h1>Employee Monitoring</h1>
            <p>Track Employee Attendance And Activity</p>
        </header>

        <!--Filters-->
        <div class="filters">
            <input type="date" id="monitorDate">
            <select class="statusFilter">
                <option value="all">All Status</option>
                <option value="present">Present</option>
                <option value="absent">Absent</option>
                <option value="late">Late</option>
            </select>
        </div>

        <!--Monitoring table-->
        <section class="table-section">
            <table class="monitorTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Time In</th>
                        <th>Time Out</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody>
                    <!--firebase dito-->
                </tbody>
            </table>
        </section>
    </main>
</body>
<script src="../js/functionalnav.js"></script>
<script src="../admin/refresh.js"></script>
</html>
