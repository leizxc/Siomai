<section class="income-cart-page">
  <div class="income-cart-header">
    <div class="income-cart-filters">
      <label for="income-date-filter">Date</label>
      <input type="date" id="income-date-filter" />
      <label for="income-employee-filter">Employee</label>
      <select id="income-employee-filter" class="browser-default">
        <option value="">All Employees</option>
      </select>
    </div>
  </div>

  <div class="income-cart-kpis">
    <article class="income-cart-kpi">
      <span>Total Income</span>
      <strong id="income-total">₱0.00</strong>
      <small>Paid orders in the selected date and employee filter</small>
    </article>
    <article class="income-cart-kpi">
      <span>Employees Timed Out</span>
      <strong id="income-cart-count">0</strong>
      <small>Completed shifts in the selected results</small>
    </article>
    <article class="income-cart-kpi">
      <span>Paid Carts</span>
      <strong id="income-cart-average">0</strong>
      <small>Orders placed during completed shifts</small>
    </article>
  </div>

  <section class="income-cart-table-card">
    <div class="table-container">
      <table id="income-cart-table" class="striped responsive-table">
        <thead>
          <tr>
            <th>Employee</th>
            <th>Completed Shifts</th>
            <th>Paid Carts</th>
            <th>Total Income</th>
          </tr>
        </thead>
        <tbody id="income-cart-rows">
          <tr>
            <td colspan="4" class="center-align">Loading income records...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</section>
