<div id="content">

  <section class="page-header">

    <div>

      <h2>Stock Status</h2>

      <p>Monitor stock availability and inventory levels.</p>

    </div>

    <div class="filters">

      <input type="date">

      <select>

        <option>All Carts</option>

      </select>

    </div>

  </section>

  <!-- Summary -->

  <div class="dashboard-cards">

    <div class="card">

      <h4>Total Products</h4>

      <h2>0</h2>

    </div>

    <div class="card">

      <h4>In Stock</h4>

      <h2>0</h2>

    </div>

  </div>

  <!-- Stock Overview -->

  <section class="card">

    <div class="overview">

      <div>

        <h4>Total Inventory Value</h4>

        <h2>₱0.00</h2>

      </div>

      <div>

        <h4>Last Stock Update</h4>

        <p>--</p>

      </div>

    </div>

  </section>

  <!-- Product List -->

  <section class="card">

    <div class="table-header">

      <h4>Stock Items</h4>

      <input type="search" placeholder="Search Product">

    </div>

    <table>

      <thead>

        <tr>

          <th>Product</th>

          <th>Category</th>

          <th>Current Stock</th>

          <th>Unit</th>

          <th>Status</th>

          <th>Last Updated</th>

        </tr>

      </thead>

      <tbody>

        <tr>

          <td>Pares</td>

          <td>Pares</td>

          <td>0</td>

          <td>Packs</td>

          <td>In Stock</td>

          <td>--</td>

        </tr>

      </tbody>

    </table>
  </section>

</div>
