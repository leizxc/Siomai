<div id="content">
  <section class="page-header">
    <div>
      <h2>Attendance</h2>
    </div>
  </section>

  <body>
    <div class="container">
      <!-- Top Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Total Hours</div>
          <div class="stat-value">38.5 <span>hrs</span></div>
          <div class="stat-sub positive">
            <span class="material-icons">trending_up</span>
            +2.4h vs last week
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Shift Streak</div>
          <div class="stat-value">12 <span>days</span></div>
          <div class="stat-sub badge">
            <span class="material-icons">emoji_events</span>
            Top Performer
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab">Today</button>
        <button class="tab active">This Week</button>
        <button class="tab-calendar">
          <span class="material-icons">calendar_today</span>
        </button>
      </div>

      <!-- Recent Activity -->
      <div class="section-title">Recent Activity</div>
      <div class="activity-list">
        <div class="section-title">Recent Activity</div>

        <div class="activity-list">
          <!-- Attendance will be loaded by attendance.js -->
        </div>
      </div>
    </div>
    <i class="material-icons more"> more_vert </i>
  </body>
</div>
