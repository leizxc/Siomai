<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#64251f" />
    <title>Under Maintenance | Queen Cassy Food Cart</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #fff8f1;
        color: #33221e;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 520px);
        padding: 48px 32px;
        border: 1px solid #f0dfd0;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 18px 60px rgb(100 37 31 / 10%);
        text-align: center;
      }
      .icon { font-size: 44px; }
      h1 { margin: 16px 0 12px; color: #64251f; font-size: clamp(28px, 7vw, 38px); }
      p { margin: 0; color: #665650; font-size: 17px; line-height: 1.65; }
      .brand { margin-top: 28px; color: #9c7769; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">🛠️</div>
      <h1>Under Maintenance</h1>
      <p>Inaayos muna namin ang system. Pakibisita ulit mamaya. Salamat sa pag-unawa.</p>
      <div class="brand">Queen Cassy Food Cart</div>
    </main>
  </body>
</html>
