<!--Header-->
<header class="header">
    <h1>Add new Product Menu</h1>
</header>

<!--product menu-->
<section class="card inventory-card">
    <form id="addProductMenu">
        <div class="row">
            <!--Inventory Allocation-->
            <div class="input-field col s12 m6">
                <select id="employeeINV">
                    <option value="" disabled selected>Inventory Allocation</option>
                </select>
                <label for="employeeINV">Inventory</label>
            </div>
            <!--Dito yung input product name-->
            <div class="input-field col s12 m6">
                <input type="text" name="input-product" id="inputProduct">
                <label for="inputProduct">Product Name (e.g Pork Siomai) </label>
            </div>
            <!--select category-->
            <div class="input-field col s12 m6">
                <select id="selectCategory">
                    <!--dito lalabas yung function kung ano na meron sa firestore na role-->
                    <option value="" disabled selected>Select Category</option>
                </select>
                <label for="selectCategory">Select Category</label>
            </div>
            <!--Initial Stock-->
            <div class="input-field col s12 m6">
                <input type="number" name="Inv-stocl" id="stock">
                <label for="stock">Initial Stock</label>
            </div>
            <!--Price-->
            <div class="input-field col s12 m6">
                <input type="number" name="Product-Price" id="price" step="0.01" min="0">
                <label for="price">Product Price</label>
            </div>
            <!--Generated Id-->
            <div class="input-field col s12">
                <p class="GeneratedId">Product Id</p>
                <input type="text" name="GeneratedId" id="productId" readonly/>
            </div>
           <!--Input Img-->
            <div class="col s12">

    <!-- Hidden File Input -->
    <input type="file" id="inputImg" accept="image/*" hidden>

    <!-- Upload Area -->
    <div class="image-upload" id="uploadBox">

        <!-- Default Placeholder -->
        <img  id="previewImage" src="/assets/upload-placeholder.png" alt="Upload Image">
    </div>

</div>
        <button type="submit" id="save-menu" class="btn save-menu">Save Product Menu</button>
    </form>
</section>
<script src="/js/photomenu.js"></script>
<script type="module">
    import{loadinventoryOptions, loadroles} from "/js/productmenu.js"
</script>
